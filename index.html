<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101722">
<title>IFS — F-16 Test</title>
<style>
:root { color-scheme: dark; --panel:rgba(10,17,27,.78); --line:rgba(255,255,255,.2); --accent:#e23b3b; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#8eb6d2; font-family:system-ui, sans-serif; touch-action:none; }
canvas { display:block; width:100%; height:100%; }
#hud { position:fixed; inset:0; pointer-events:none; color:white; }
.top { position:absolute; top: max(12px,env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 12px; backdrop-filter:blur(8px); box-shadow:0 4px 18px #0003; }
.brand { font-weight:800; letter-spacing:.08em; font-size:12px; }
#status { font-size:11px; opacity:.8; margin-top:3px; }
.metrics { display:flex; gap:14px; text-align:right; font-variant-numeric:tabular-nums; }
.metric small { display:block; opacity:.7; font-size:9px; letter-spacing:.08em; }
.metric strong { font-size:16px; }
#hint { position:absolute; top:86px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:11px; opacity:.8; }
#controls { position:absolute; bottom:max(18px,env(safe-area-inset-bottom)); left:0; right:0; display:flex; align-items:flex-end; justify-content:space-between; padding:0 18px; }
#yokeWrap { pointer-events:auto; width: min(34vw,150px); height:min(34vw,150px); position:relative; border-radius:50%; border:2px solid #ffffff66; background:radial-gradient(circle,#ffffff20,#07111c55); box-shadow:0 4px 20px #0004; touch-action:none; }
#yokeWrap:before,#yokeWrap:after { content:""; position:absolute; background:#ffffff35; }
#yokeWrap:before { width:1px; top:8%; bottom:8%; left:50%; }
#yokeWrap:after { height:1px; left:8%; right:8%; top:50%; }
#yoke { position:absolute; width:38%; height:38%; left:31%; top:31%; border-radius:50%; border:2px solid white; background:linear-gradient(145deg,#596a7c,#182535); box-shadow:0 3px 10px #0008; }
#yokeLabel { position:absolute; left:50%; bottom:-23px; transform:translateX(-50%); font-size:10px; letter-spacing:.12em; white-space:nowrap; text-shadow:0 1px 4px black; }
#throttlePanel { pointer-events:auto; width:72px; padding:10px 9px 12px; display:flex; flex-direction:column; align-items:center; gap:7px; }
#throttle { writing-mode:vertical-lr; direction:rtl; width:34px; height: min(34vw,145px); accent-color:var(--accent); touch-action:pan-y; }
#throttleValue { font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; }
#throttlePanel label { font-size:10px; letter-spacing:.1em; }
#reset { pointer-events:auto; border:1px solid var(--line); border-radius:9px; padding:7px 10px; color:white; background:var(--panel); font-weight:700; }
#bottomNote { position:absolute; bottom:max(10px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); font-size:9px; opacity:.55; white-space:nowrap; }
@media (orientation:landscape) { #controls { padding:0 28px 10px; } #yokeWrap { width:120px;height:120px; } #throttle { height:118px; } }
</style>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="panel"><div class="brand">IFS</div><div id="status">Loading F-16…</div></div>
    <div class="panel metrics">
      <div class="metric"><small>IAS</small><strong><span id="speed">0</span> <small>km/h</small></strong></div>
      <div class="metric"><small>ALT</small><strong><span id="alt">0</span> <small>m</small></strong></div>
      <div class="metric"><small>THR</small><strong><span id="thrRead">0</span><small>%</small></strong></div>
    </div>
  </div>
  <div id="hint" class="panel">Yoke: pitch + roll · Throttle: engine power</div>
  <div id="controls">
    <div id="yokeWrap" aria-label="Flight yoke">
      <div id="yoke"></div><div id="yokeLabel">Y O K E</div>
    </div>
    <div id="throttlePanel" class="panel">
      <label for="throttle">THROTTLE</label>
      <input id="throttle" type="range" min="0" max="100" value="65">
      <div id="throttleValue">65%</div>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const statusEl = document.querySelector('#status');
const speedEl = document.querySelector('#speed');
const altEl = document.querySelector('#alt');
const thrRead = document.querySelector('#thrRead');
const throttle = document.querySelector('#throttle');
const throttleValue = document.querySelector('#throttleValue');
const yokeWrap = document.querySelector('#yokeWrap');
const yoke = document.querySelector('#yoke');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8eb6d2);
scene.fog = new THREE.Fog(0x8eb6d2, 1800, 6500);
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 12000);
camera.position.set(0, 8, -22);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeeff, 0x536070, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-80,120,-40);
scene.add(sun);

// PROCEDURAL WORLD — 20 x 20 km, streamed in 1 km terrain chunks.
const WORLD_SIZE = 20000;
const CHUNK_SIZE = 1000;
const CHUNK_RADIUS = 2;
const CHUNK_SEGMENTS = 32;
const terrainChunks = new Map();

const terrainMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 1,
  metalness: 0
});

const treeTrunkGeometry = new THREE.CylinderGeometry(0.65, 1.0, 7, 5);
const treeCrownGeometry = new THREE.ConeGeometry(5.2, 15, 6);
const treeTrunkMaterial = new THREE.MeshStandardMaterial({color:0x59402b, roughness:1});
const treeCrownMaterial = new THREE.MeshStandardMaterial({color:0x285b35, roughness:1});

function smooth01(a, b, x) {
  const t = THREE.MathUtils.clamp((x-a)/(b-a), 0, 1);
  return t*t*(3-2*t);
}

// Deterministic height function: the same coordinates always produce the same terrain.
function terrainHeight(x, z) {
  const broad = Math.sin(x*0.00048 + 0.7) * Math.cos(z*0.00043 - 0.4) * 95;
  const hills = Math.sin(x*0.00125 + z*0.00072) * 34
              + Math.cos(z*0.00155 - x*0.00038) * 25;
  const detail = Math.sin(x*0.0041 + 1.2) * Math.cos(z*0.0037) * 5;
  const mountainMask = smooth01(700, 2200, Math.abs(x) + Math.abs(z)*0.55);
  const mountains = Math.max(0, Math.sin(x*0.00072 + z*0.00031) *
                    Math.cos(z*0.00061 - x*0.00022)) * 190 * mountainMask;
  let h = broad + hills + detail + mountains;

  // Flatten a broad rectangle for the starter airfield.
  const airportDistance = Math.max(Math.abs(x)-260, Math.abs(z)-850, 0);
  const airportBlend = smooth01(100, 420, airportDistance);
  h *= airportBlend;
  return h;
}

function seededRandom(seed) {
  let value = seed >>> 0;
  return function() {
    value = (value * 1664525 + 1013904223) >>> 0;
    return value / 4294967296;
  };
}

function buildTerrainChunk(cx, cz) {
  const key = cx + "," + cz;
  if (terrainChunks.has(key)) return;

  const group = new THREE.Group();
  group.position.set(cx*CHUNK_SIZE, 0, cz*CHUNK_SIZE);

  const positions = [];
  const colors = [];
  const indices = [];
  const color = new THREE.Color();

  for (let iz=0; iz<=CHUNK_SEGMENTS; iz++) {
    for (let ix=0; ix<=CHUNK_SEGMENTS; ix++) {
      const lx = ix/CHUNK_SEGMENTS*CHUNK_SIZE;
      const lz = iz/CHUNK_SEGMENTS*CHUNK_SIZE;
      const wx = cx*CHUNK_SIZE + lx;
      const wz = cz*CHUNK_SIZE + lz;
      const h = terrainHeight(wx, wz);
      positions.push(lx, h, lz);

      if (h > 175) color.setHex(0x77796f);
      else if (h > 95) color.setHex(0x667653);
      else if (h > 35) color.setHex(0x557849);
      else if (h < -18) color.setHex(0x526d48);
      else color.setHex(0x64834e);
      const variation = 0.94 + 0.06*Math.sin(wx*0.03 + wz*0.02);
      colors.push(color.r*variation, color.g*variation, color.b*variation);
    }
  }

  for (let iz=0; iz<CHUNK_SEGMENTS; iz++) {
    for (let ix=0; ix<CHUNK_SEGMENTS; ix++) {
      const a = iz*(CHUNK_SEGMENTS+1)+ix;
      const b = a+1;
      const c = a+CHUNK_SEGMENTS+1;
      const d = c+1;
      indices.push(a,c,b, b,c,d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions,3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors,3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const terrain = new THREE.Mesh(geometry, terrainMaterial);
  terrain.receiveShadow = false;
  group.add(terrain);

  // Lightweight instanced forests. Keep the starter airport clear.
  const random = seededRandom((cx+100)*73856093 ^ (cz+100)*19349663);
  const treeCount = 34;
  const trunks = new THREE.InstancedMesh(treeTrunkGeometry, treeTrunkMaterial, treeCount);
  const crowns = new THREE.InstancedMesh(treeCrownGeometry, treeCrownMaterial, treeCount);
  const dummy = new THREE.Object3D();
  let placed = 0;

  for (let i=0; i<treeCount; i++) {
    const wx = cx*CHUNK_SIZE + 35 + random()*(CHUNK_SIZE-70);
    const wz = cz*CHUNK_SIZE + 35 + random()*(CHUNK_SIZE-70);
    if (Math.abs(wx) < 390 && Math.abs(wz) < 980) continue;
    const groundY = terrainHeight(wx,wz);
    const scale = 0.65 + random()*0.8;
    dummy.position.set(wx-cx*CHUNK_SIZE, groundY+3.5*scale, wz-cz*CHUNK_SIZE);
    dummy.scale.setScalar(scale);
    dummy.rotation.y = random()*Math.PI*2;
    dummy.updateMatrix();
    trunks.setMatrixAt(placed,dummy.matrix);

    dummy.position.y = groundY + 13*scale;
    dummy.updateMatrix();
    crowns.setMatrixAt(placed,dummy.matrix);
    placed++;
  }

  trunks.count = placed;
  crowns.count = placed;
  group.add(trunks,crowns);

  scene.add(group);
  terrainChunks.set(key, {group, geometry, trunks, crowns});
}

function updateTerrainChunks() {
  const centerX = Math.floor(aircraft.position.x/CHUNK_SIZE);
  const centerZ = Math.floor(aircraft.position.z/CHUNK_SIZE);
  const wanted = new Set();

  for (let dz=-CHUNK_RADIUS; dz<=CHUNK_RADIUS; dz++) {
    for (let dx=-CHUNK_RADIUS; dx<=CHUNK_RADIUS; dx++) {
      const cx = centerX+dx;
      const cz = centerZ+dz;
      const min = -WORLD_SIZE/2/CHUNK_SIZE;
      const max = WORLD_SIZE/2/CHUNK_SIZE-1;
      if (cx<min || cx>max || cz<min || cz>max) continue;
      const key = cx + "," + cz;
      wanted.add(key);
      buildTerrainChunk(cx,cz);
    }
  }

  for (const [key, chunk] of terrainChunks) {
    if (!wanted.has(key)) {
      scene.remove(chunk.group);
      chunk.geometry.dispose();
      chunk.trunks.dispose();
      chunk.crowns.dispose();
      terrainChunks.delete(key);
    }
  }
}

// Starter airfield at the world origin.
const airport = new THREE.Group();
const runway = new THREE.Mesh(
  new THREE.PlaneGeometry(48,1500),
  new THREE.MeshStandardMaterial({color:0x30343a, roughness:1})
);
runway.rotation.x = -Math.PI/2;
runway.position.set(0,0.8,0);
airport.add(runway);

const runwayPaintMaterial = new THREE.MeshBasicMaterial({color:0xf1f0df});
function runwayMark(width, length, x, z, y=1.05) {
  const mark = new THREE.Mesh(new THREE.PlaneGeometry(width,length), runwayPaintMaterial);
  mark.rotation.x = -Math.PI/2;
  mark.position.set(x,y,z);
  airport.add(mark);
}
for (let z=-690; z<=690; z+=95) runwayMark(1.2,38,0,z);
for (const z of [-690,690]) {
  for (let x=-17; x<=17; x+=8.5) runwayMark(3,24,x,z);
}
const apron = new THREE.Mesh(
  new THREE.PlaneGeometry(180,130),
  new THREE.MeshStandardMaterial({color:0x777b7d, roughness:1})
);
apron.rotation.x = -Math.PI/2;
apron.position.set(125,0.65,-540);
airport.add(apron);
scene.add(airport);

// Initial terrain is generated after the aircraft object is created.

const aircraft = new THREE.Group();
scene.add(aircraft);

let model = null;
const loader = new GLTFLoader();

loader.load('./F-16.glb', (gltf) => {
  model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  model.position.sub(center);

  const longest = Math.max(size.x,size.y,size.z);
  model.scale.setScalar(12 / longest);

  aircraft.add(model);
  statusEl.textContent = 'F-16 loaded · test flight ready';
}, undefined, (err) => {
  console.error(err);
  statusEl.textContent = 'Could not load F-16.glb — check both files are in the same folder';
});

// Forward is local +Z. Start with a small nose-up attitude for level flight.
aircraft.position.set(0, 45, 0);
aircraft.rotation.x = -0.07;
updateTerrainChunks();

let speed = 105;
const velocity = new THREE.Vector3(0, 0, 105);
const aircraftUp = new THREE.Vector3();
const liftDirection = new THREE.Vector3();
const acceleration = new THREE.Vector3();
let pitchRate = 0;
let rollRate = 0;
let yawRate = 0;
let throttleInput = Number(throttle.value)/100;
let yokeX = 0;
let yokeY = 0;

const clock = new THREE.Clock();
const forward = new THREE.Vector3();

// Chase camera
const cameraOffset = new THREE.Vector3(0, 5, -17);
const cameraPosition = new THREE.Vector3();

const cameraFlip = new THREE.Quaternion().setFromAxisAngle(
  new THREE.Vector3(0, 1, 0),
  Math.PI
);

function updateYokeVisual() {
  yoke.style.transform =
    `translate(${yokeX*44}px, ${-yokeY*44}px)`;
}

function setYokeFromPointer(e) {
  const r = yokeWrap.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;

  yokeX = THREE.MathUtils.clamp(
    (e.clientX-cx)/(r.width*0.36), -1, 1
  );

  // Joystick up/down input
  yokeY = -THREE.MathUtils.clamp(
    (e.clientY-cy)/(r.height*0.36), -1, 1
  );

  updateYokeVisual();
}

let yokePointer = null;

yokeWrap.addEventListener('pointerdown', e => {
  yokePointer = e.pointerId;
  yokeWrap.setPointerCapture(e.pointerId);
  setYokeFromPointer(e);
});

yokeWrap.addEventListener('pointermove', e => {
  if(e.pointerId === yokePointer) setYokeFromPointer(e);
});

function releaseYoke(e) {
  if(e.pointerId === yokePointer) {
    yokePointer = null;
    yokeX = 0;
    yokeY = 0;
    updateYokeVisual();
  }
}

yokeWrap.addEventListener('pointerup', releaseYoke);
yokeWrap.addEventListener('pointercancel', releaseYoke);

throttle.addEventListener('input', () => {
  throttleInput = Number(throttle.value)/100;
  throttleValue.textContent = `${throttle.value}%`;
});

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  // Airspeed changes naturally through thrust and aerodynamic drag.
  aircraft.getWorldDirection(forward);
  aircraftUp.set(0, 1, 0).applyQuaternion(aircraft.quaternion);

  const controlAuthority = THREE.MathUtils.clamp(speed / 100, 0.35, 1.25);

  // Controls have a little inertia instead of instantly rotating the aircraft.
  const targetPitchRate = yokeY * 0.62 * controlAuthority;
  const targetRollRate = yokeX * 0.90 * controlAuthority;
  pitchRate += (targetPitchRate - pitchRate) * Math.min(1, dt * 4.5);
  rollRate += (targetRollRate - rollRate) * Math.min(1, dt * 4.5);
  yawRate += (0 - yawRate) * Math.min(1, dt * 2.5);

  // Preserve the tested pitch direction: UP = nose down, DOWN = nose up.
  aircraft.rotateX(pitchRate * dt);
  aircraft.rotateZ(rollRate * dt);
  aircraft.rotateY(yawRate * dt);

  aircraft.getWorldDirection(forward);
  aircraftUp.set(0, 1, 0).applyQuaternion(aircraft.quaternion);

  speed = velocity.length();
  const airDirection = speed > 0.1
    ? velocity.clone().multiplyScalar(1 / speed)
    : forward.clone();

  // Angle of attack: the angle between the aircraft's nose and airflow.
  const aoa = Math.atan2(
    -airDirection.dot(aircraftUp),
    airDirection.dot(forward)
  );

  // Simplified F-16 aerodynamic model: lift, stall and induced drag.
  let liftCoefficient = THREE.MathUtils.clamp(0.28 + 4.8 * aoa, -0.9, 1.55);
  const stallAngle = Math.abs(aoa);
  if (stallAngle > 0.26) {
    liftCoefficient *= THREE.MathUtils.clamp(1 - (stallAngle - 0.26) * 1.8, 0.35, 1);
  }

  liftDirection.copy(aircraftUp)
    .addScaledVector(airDirection, -aircraftUp.dot(airDirection));
  if (liftDirection.lengthSq() > 0.0001) liftDirection.normalize();

  acceleration.set(0, -9.81, 0); // Gravity
  acceleration.addScaledVector(forward, 11 * throttleInput); // Engine thrust

  if (speed > 1 && liftDirection.lengthSq() > 0.0001) {
    const dynamicPressureFactor = 0.5 * 1.225 * speed * speed * 27.87 / 12000;
    const liftAcceleration = dynamicPressureFactor * liftCoefficient;
    acceleration.addScaledVector(liftDirection, liftAcceleration);

    const parasiteDrag = 0.0009 * speed * speed;
    const inducedDrag = 0.75 * liftCoefficient * liftCoefficient;
    const dragAcceleration = parasiteDrag + inducedDrag;
    acceleration.addScaledVector(airDirection, -dragAcceleration);
  }

  // Integrate forces into velocity and position.
  velocity.addScaledVector(acceleration, dt);
  aircraft.position.addScaledVector(velocity, dt);
  speed = velocity.length();

  // Stop the aircraft passing through the terrain.
  const groundY = terrainHeight(aircraft.position.x, aircraft.position.z) + 4;
  if (aircraft.position.y < groundY) {
    aircraft.position.y = groundY;
    if (velocity.y < 0) velocity.y = 0;
    velocity.multiplyScalar(0.82);
  }

  // Stream terrain around the aircraft.
  updateTerrainChunks();

  // Rigid chase camera.
  cameraPosition.copy(cameraOffset).applyQuaternion(aircraft.quaternion);
  camera.position.copy(aircraft.position).add(cameraPosition);
  camera.quaternion.copy(aircraft.quaternion).multiply(cameraFlip);

  speedEl.textContent = Math.round(speed * 3.6);
  altEl.textContent = Math.round(aircraft.position.y);
  thrRead.textContent = Math.round(throttleInput * 100);

  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
